<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>little reminder for you</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg"></div>
  <div class="veil"></div>

  <main class="page">
    <section class="card">
      <div class="eyebrow">for astrid, on the days you need it.</div>
      <h1>hey, astrid.</h1>
      <p class="lead" id="message">kuliah boleh dikejar, tapi diri sendiri jangan ditinggal.</p>

      <div class="reminders">
        <button class="reminder" data-text="udah makan hari ini? jangan cuma kopi sama tugas, manusia butuh nasi juga 😭">
          <span>01</span><b>eat</b><small>jangan lupa makan</small>
        </button>
        <button class="reminder" data-text="minum dulu. iya, sekarang. buka botolnya, jangan cuma dibaca 😭">
          <span>02</span><b>drink</b><small>cukupin airnya</small>
        </button>
        <button class="reminder" data-text="kalau badan udah capek, istirahat bukan berarti kalah. besok masih ada yang harus dikerjain.">
          <span>03</span><b>rest</b><small>kasih badan waktu</small>
        </button>
      </div>

      <button class="main-btn" id="encourage">kasih aku satu alasan buat lanjut</button>

      <div class="quote" id="quote">
        <span>✦</span>
        <p>kamu nggak harus menyelesaikan semuanya hari ini.</p>
      </div>

      <footer>
        <span>made with care</span>
        <span>for someone who deserves to be okay</span>
      </footer>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
